<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發牌 · 橋牌隨機發牌器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1: #1d5138; --bg2: #16412f; --bg3: #0f2e21;
    --text-main: rgba(244,236,216,0.94);
    --text-soft: rgba(244,236,216,0.66);
    --accent: #c9a227;
    --card-face: #f4ecd8;
    --ink: #1c1a17;
    --ink-soft: #4a453d;
    --suit-red: #a6402f;
    --suit-black: #1c1a17;
    --line: rgba(244,236,216,0.14);
    --line-strong: rgba(244,236,216,0.28);
  }

  body[data-theme="navy"]{
    --bg1: #1b3a63; --bg2: #122a4a; --bg3: #0a1830;
    --accent: #8fc1e8;
  }
  body[data-theme="burgundy"]{
    --bg1: #4a1b23; --bg2: #37141a; --bg3: #220c10;
    --accent: #d9a441;
  }
  body[data-theme="charcoal"]{
    --bg1: #2a2a2a; --bg2: #1e1e1e; --bg3: #121212;
    --accent: #cfa63c;
  }
  body[data-theme="parchment"]{
    --bg1: #efe6c9; --bg2: #e4d8b4; --bg3: #cbb994;
    --text-main: rgba(28,26,23,0.92);
    --text-soft: rgba(28,26,23,0.62);
    --accent: #7a4b17;
    --line: rgba(28,26,23,0.14);
    --line-strong: rgba(28,26,23,0.28);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; min-height:100%;
    font-family: 'Inter', sans-serif;
  }

  body{
    background: radial-gradient(ellipse at 50% -10%, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    color: var(--text-main);
    display:flex; flex-direction:column; align-items:center;
    padding: 28px 16px 80px;
    transition: background 0.3s ease;
  }

  header{ width:100%; max-width: 920px; text-align:center; margin-bottom: 20px; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size: 12px;
    letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent);
    margin: 0 0 10px;
  }

  h1{
    font-family:'Fraunces', serif; font-weight: 600;
    font-size: clamp(30px, 5.5vw, 48px); margin: 0 0 10px; letter-spacing: -0.01em;
  }

  .sub{ color: var(--text-soft); font-size: 14.5px; max-width: 520px; margin: 0 auto; line-height: 1.6; }

  main{ width:100%; max-width: 920px; }

  noscript .noscript-banner{
    display:block; max-width: 920px; margin: 0 auto 20px; padding: 16px 18px;
    border: 1px solid var(--line-strong); border-radius: 10px;
    background: rgba(0,0,0,0.15); font-size: 14px; line-height: 1.7;
  }
  noscript .noscript-banner a{ color: var(--accent); }

  details.settings{
    border: 1px solid var(--line-strong); border-radius: 12px;
    margin: 0 0 26px; padding: 4px 18px; background: rgba(0,0,0,0.12);
  }
  details.settings > summary{
    cursor:pointer; padding: 12px 0; font-family:'Fraunces', serif;
    font-size: 16px; font-weight: 600; list-style: none;
    display:flex; align-items:center; justify-content:space-between;
  }
  details.settings > summary::-webkit-details-marker{ display:none; }
  details.settings > summary::after{ content: "▾"; color: var(--accent); transition: transform 0.2s; }
  details.settings[open] > summary::after{ transform: rotate(180deg); }

  .settings-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
    gap: 20px; padding: 4px 0 20px;
  }
  .field-group h3{
    font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-soft); margin: 0 0 10px;
  }
  .radio-row, .check-row{ display:flex; flex-direction:column; gap: 7px; font-size: 13.5px; }
  .radio-row label, .check-row label{ display:flex; align-items:center; gap: 8px; cursor:pointer; }
  .radio-row input, .check-row input{ accent-color: var(--accent); }

  .board-input{ display:flex; align-items:center; gap: 8px; margin-top: 10px; font-size: 13px; }
  .board-input input{
    width: 64px; background: rgba(0,0,0,0.2); border: 1px solid var(--line-strong);
    color: var(--text-main); border-radius: 6px; padding: 4px 8px; font-family:'IBM Plex Mono', monospace;
  }

  .theme-swatches{ display:flex; gap: 10px; flex-wrap: wrap; }
  .swatch{
    width: 30px; height: 30px; border-radius: 50%; cursor:pointer;
    border: 2px solid transparent; padding:0;
  }
  .swatch[data-t="felt"]{ background: linear-gradient(135deg,#1d5138,#0f2e21); }
  .swatch[data-t="navy"]{ background: linear-gradient(135deg,#1b3a63,#0a1830); }
  .swatch[data-t="burgundy"]{ background: linear-gradient(135deg,#4a1b23,#220c10); }
  .swatch[data-t="charcoal"]{ background: linear-gradient(135deg,#2a2a2a,#121212); }
  .swatch[data-t="parchment"]{ background: linear-gradient(135deg,#efe6c9,#cbb994); }
  .swatch.active{ border-color: var(--accent); }
  .swatch:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .table{
    display:grid; grid-template-columns: 1fr 1.15fr 1fr; grid-template-rows: auto auto auto;
    grid-template-areas: ".    north .   " "west center east" ".    south .   ";
    gap: 14px; align-items: center; justify-items: center;
  }
  .seat-north{ grid-area: north; } .seat-south{ grid-area: south; }
  .seat-west{  grid-area: west; }  .seat-east{  grid-area: east; }
  .center-info{ grid-area: center; }

  .seat{ width: 100%; max-width: 240px; perspective: 1200px; }
  .seat-inner{
    position: relative; width: 100%; min-height: 168px;
    transition: transform 0.55s cubic-bezier(.2,.7,.3,1); transform-style: preserve-3d;
  }
  .seat.revealed .seat-inner{ transform: rotateY(180deg); }
  .seat.dummy .seat-inner{ transform: rotateY(180deg); transition:none; }
  .seat.locked .seat-back{ cursor: not-allowed; opacity: 0.55; }

  /* seat-face 改採一般文件流撐開 seat-inner 的高度，seat-back 疊在上方蓋住，
     避免手牌內容（如長花色）因固定高度而溢出卡片邊界、覆蓋到下一張卡片 */
  .seat-face, .seat-back{
    backface-visibility: hidden;
    border-radius: 10px; border: 1px solid var(--line-strong);
    box-sizing: border-box; width: 100%;
  }
  .seat-back{
    position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 8px, rgba(0,0,0,0.08) 8px 16px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 8px;
    cursor: pointer; color: var(--text-main); border-width:1px;
  }
  .seat-back:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .seat-label{ font-family:'Fraunces', serif; font-size: 24px; font-weight: 700; }
  .seat-hint{ font-family:'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-soft); }

  .seat-face{
    position: relative; min-height: 168px;
    background: var(--card-face); color: var(--ink); transform: rotateY(180deg);
    padding: 12px 14px; display:flex; flex-direction:column; gap: 6px; text-align:left;
  }
  .seat.dummy .seat-face{ border: 1px solid var(--accent); }

  .seat-face .seat-head{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom: 1px solid rgba(28,26,23,0.15); padding-bottom: 6px; margin-bottom: 2px; gap: 8px;
  }
  .seat-face .seat-head .name{ font-family:'Fraunces', serif; font-weight: 700; font-size: 17px; }
  .seat-face .seat-head .hcp{ font-family:'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink-soft); text-align:right; }

  .info-line{ font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); display:flex; gap:10px; flex-wrap:wrap; }
  .badge{ display:inline-block; padding: 1px 6px; border-radius: 999px; background: rgba(28,26,23,0.08); }

  .suit-row{ display:flex; gap: 8px; font-family:'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.5; }
  .suit-row .glyph{ width: 18px; flex: none; font-weight: 600; }
  .suit-row .cards{ overflow-wrap: break-word; word-break: break-word; }
  .suit-row.red .glyph, .suit-row.red .cards{ color: var(--suit-red); }
  .suit-row.black .glyph, .suit-row.black .cards{ color: var(--suit-black); }
  .suit-row .cards.empty{ color: rgba(28,26,23,0.35); }

  .dummy-subgroup{ margin-top: 4px; font-size: 11px; color: var(--ink-soft); border-top: 1px dashed rgba(28,26,23,0.15); padding-top: 4px; }

  .center-info{
    width: 100%; max-width: 210px; text-align:center; padding: 16px 10px;
    border: 1px dashed var(--line-strong); border-radius: 10px;
    display:flex; flex-direction:column; gap: 8px;
  }
  .dealer-tag{ font-family:'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; color: var(--text-soft); text-transform: uppercase; }
  .dealer-name{ font-family:'Fraunces', serif; font-size: 22px; font-weight: 700; color: var(--accent); }
  .vul-tag{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-soft); }
  .board-no{ font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text-soft); }

  .actions{ margin-top: 30px; display:flex; flex-direction:column; align-items:center; gap: 14px; }
  .btn-row{ display:flex; flex-wrap:wrap; justify-content:center; gap: 10px; }

  button.deal-btn, a.deal-btn{
    font-family:'Fraunces', serif; font-weight: 600; font-size: 17px; letter-spacing: 0.02em;
    color: var(--bg3); background: var(--accent); border: none; padding: 13px 36px; border-radius: 999px;
    cursor: pointer; transition: transform 0.15s ease; box-shadow: 0 10px 24px -8px rgba(0,0,0,0.4);
    text-decoration: none; display: inline-block;
  }
  button.deal-btn:hover, a.deal-btn:hover{ transform: translateY(-1px); }
  button.deal-btn:focus-visible, a.deal-btn:focus-visible{ outline: 2px solid var(--text-main); outline-offset: 3px; }

  button.ghost-btn{
    background: none; border: 1px solid var(--line-strong); color: var(--text-main);
    font-family:'Inter', sans-serif; font-size: 13px; padding: 8px 16px; border-radius: 999px; cursor: pointer;
  }
  button.ghost-btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  button.ghost-btn:disabled{ opacity: 0.4; cursor:not-allowed; }

  .share-links{ margin-top: 18px; width:100%; max-width: 480px; display:flex; flex-direction:column; gap: 8px; }
  .share-links .row{
    display:flex; align-items:center; justify-content:space-between; gap: 10px;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 12.5px;
  }
  .share-links .row span.seat{ font-family:'Fraunces', serif; font-weight:700; }
  .share-links .row button{
    font-size: 11.5px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line-strong);
    background: none; color: var(--text-main); cursor:pointer;
  }

  .download-section{ margin-top: 24px; text-align: center; }

  .status-msg{ font-size: 12.5px; color: var(--text-soft); min-height: 16px; }
  .empty-state{ text-align:center; color: var(--text-soft); font-size: 14px; padding: 40px 0; }
  .locked-banner{
    text-align:center; font-size: 13px; color: var(--text-soft); margin-bottom: 16px;
    border: 1px dashed var(--line-strong); border-radius: 8px; padding: 10px 14px;
  }

  @media (max-width: 640px){
    .table{ grid-template-columns: 1fr; grid-template-areas: "center" "north" "east" "south" "west"; }
    .seat, .center-info{ max-width: 340px; }
  }
  @media (prefers-reduced-motion: reduce){ .seat-inner{ transition: none; } }
</style>
</head>
<body data-theme="felt">

<noscript>
  <div class="noscript-banner">
    這個頁面的隨機發牌功能需要 JavaScript 才能運算。若你使用的是純文字瀏覽器（例如 w3m）或已關閉 JavaScript，
    請改用預先產生好的靜態牌局列表：<a href="boards/index.html">boards/index.html</a>。
    每份牌局都是固定內容的純 HTML 頁面，用點選連結的方式挑一份即可，不需要任何程式執行。
  </div>
</noscript>

<header>
  <p class="eyebrow">By HSNUBC 37th</p>
  <h1>Bridge Dealer</h1>
  <p class="sub">設定人數、發牌方式與分享模式後按「發牌」；每家的牌先蓋牌，點按自己的牌組即可翻開查看。</p>
</header>

<main>
  <details class="settings" id="settingsPanel">
    <summary>發牌設定</summary>
    <div class="settings-grid">
      <div class="field-group">
        <h3>人數模式</h3>
        <div class="radio-row" id="variantRadios">
          <label><input type="radio" name="variant" value="4p" checked> 四人橋牌（北東南西）</label>
          <label><input type="radio" name="variant" value="3p"> 三人橋牌（北家為固定夢家）</label>
        </div>
      </div>

      <div class="field-group" id="dealModeGroup">
        <h3>發牌方式</h3>
        <div class="radio-row" id="dealModeRadios">
          <label><input type="radio" name="dealMode" value="random" checked> 純隨機（每次隨機決定莊家）</label>
          <label><input type="radio" name="dealMode" value="duplicate"> 複式橋牌（依牌號固定莊家／身價）</label>
        </div>
        <div class="board-input" id="boardInputWrap" hidden>
          <label for="boardNoInput">牌號</label>
          <input type="number" id="boardNoInput" min="1" max="16" value="1">
        </div>
      </div>

      <div class="field-group">
        <h3>分享模式</h3>
        <div class="radio-row" id="shareModeRadios">
          <label><input type="radio" name="shareMode" value="solo" checked> 單機（本機可查看全部手牌）</label>
          <label><input type="radio" name="shareMode" value="shared"> 多人分享（各自連結只看自己那家）</label>
        </div>
      </div>

      <div class="field-group">
        <h3>顯示資訊</h3>
        <div class="check-row" id="infoChecks">
          <label><input type="checkbox" value="hcp" checked> HCP 高牌點</label>
          <label><input type="checkbox" value="shape" checked> 牌型分佈（如 4-3-3-3）</label>
          <label><input type="checkbox" value="balanced"> 均型 / 不均型標示</label>
          <label><input type="checkbox" value="totalPoints"> 總點數（HCP + 長度點）</label>
          <label><input type="checkbox" value="longest"> 最長花色</label>
        </div>
      </div>

      <div class="field-group">
        <h3>背景色彩</h3>
        <div class="theme-swatches" id="themeSwatches">
          <button class="swatch active" data-t="felt" aria-label="牌桌綠"></button>
          <button class="swatch" data-t="navy" aria-label="海軍藍"></button>
          <button class="swatch" data-t="burgundy" aria-label="酒紅"></button>
          <button class="swatch" data-t="charcoal" aria-label="炭灰"></button>
          <button class="swatch" data-t="parchment" aria-label="米白亮色"></button>
        </div>
      </div>
    </div>
  </details>

  <div id="lockedBanner"></div>

  <div class="table" id="table">
    <div class="empty-state" style="grid-column:1/-1;">尚未發牌，設定完成後按下方按鈕開始。</div>
  </div>

  <div class="actions">
    <div class="btn-row">
      <button class="deal-btn" id="dealBtn">發牌 Deal</button>
    </div>
    <div class="btn-row">
      <button class="ghost-btn" id="revealAllBtn" hidden>全部翻開</button>
      <button class="ghost-btn" id="copyBtn" hidden>複製牌型</button>
      <button class="ghost-btn" id="exportBtn" hidden>匯出圖片</button>
    </div>
    <p class="status-msg" id="statusMsg"></p>
    <div class="share-links" id="shareLinks"></div>
    <div class="download-section">
      <a href="boards.zip" class="deal-btn" id="downloadBtn" download>Open sources and download</a>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  const SUITS = [
    { key: 'C', glyph: '♣', color: 'black' },
    { key: 'D', glyph: '♦', color: 'red'   },
    { key: 'H', glyph: '♥', color: 'red'   },
    { key: 'S', glyph: '♠', color: 'black' },
  ];
  const DISPLAY_ORDER = ['S','H','D','C'];
  const RANKS = ['A','K','Q','J','10','9','8','7','6','5','4','3','2'];
  const HCP_VALUE = { A:4, K:3, Q:2, J:1 };

  const SEATS_4P = [
    { key: 'N', label: '北', full: 'North' },
    { key: 'E', label: '東', full: 'East'  },
    { key: 'S', label: '南', full: 'South' },
    { key: 'W', label: '西', full: 'West'  },
  ];

  const DUPLICATE_TABLE = [
    {dealer:'N', vul:'none'}, {dealer:'E', vul:'ns'},   {dealer:'S', vul:'ew'},   {dealer:'W', vul:'both'},
    {dealer:'N', vul:'ns'},   {dealer:'E', vul:'ew'},   {dealer:'S', vul:'both'}, {dealer:'W', vul:'none'},
    {dealer:'N', vul:'ew'},   {dealer:'E', vul:'both'}, {dealer:'S', vul:'none'}, {dealer:'W', vul:'ns'},
    {dealer:'N', vul:'both'}, {dealer:'E', vul:'none'}, {dealer:'S', vul:'ns'},   {dealer:'W', vul:'ew'},
  ];
  const VUL_LABEL = { none:'none', ns:'N-S', ew:'E-W', both:'both' };

  const els = {
    settingsPanel: document.getElementById('settingsPanel'),
    variantRadios: document.getElementById('variantRadios'),
    dealModeGroup: document.getElementById('dealModeGroup'),
    dealModeRadios: document.getElementById('dealModeRadios'),
    boardInputWrap: document.getElementById('boardInputWrap'),
    boardNoInput: document.getElementById('boardNoInput'),
    shareModeRadios: document.getElementById('shareModeRadios'),
    infoChecks: document.getElementById('infoChecks'),
    themeSwatches: document.getElementById('themeSwatches'),
    table: document.getElementById('table'),
    dealBtn: document.getElementById('dealBtn'),
    revealAllBtn: document.getElementById('revealAllBtn'),
    copyBtn: document.getElementById('copyBtn'),
    exportBtn: document.getElementById('exportBtn'),
    statusMsg: document.getElementById('statusMsg'),
    shareLinks: document.getElementById('shareLinks'),
    lockedBanner: document.getElementById('lockedBanner'),
  };

  const PREF_KEY = 'bridgeDealerPrefs.v1';
  const SECRET_SALT = 'BridgeDealerHashSalt_2026';

  function loadPrefs(){
    try{ return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; }catch(e){ return {}; }
  }
  function savePrefs(p){
    try{ localStorage.setItem(PREF_KEY, JSON.stringify(p)); }catch(e){ }
  }

  const state = {
    variant: '4p',
    dealMode: 'random',
    boardNo: 1,
    shareMode: 'solo',
    seat: null,
    seed: null,
    theme: 'felt',
    info: { hcp:true, shape:true, balanced:false, totalPoints:false, longest:false },
    lastHands: null,
    lastDealer: null,
    lastVul: null,
    lastBoard: null,
    invalidToken: false
  };

  (function applyPrefs(){
    const p = loadPrefs();
    if (p.variant) state.variant = p.variant;
    if (p.dealMode) state.dealMode = p.dealMode;
    if (p.theme) state.theme = p.theme;
    if (p.info) Object.assign(state.info, p.info);

    els.variantRadios.querySelector(`input[value="${state.variant}"]`).checked = true;
    els.dealModeRadios.querySelector(`input[value="${state.dealMode}"]`).checked = true;
    Object.keys(state.info).forEach(k=>{
      const cb = els.infoChecks.querySelector(`input[value="${k}"]`);
      if (cb) cb.checked = state.info[k];
    });
    setTheme(state.theme);
    toggleDealModeVisibility();
  })();

  function computeHash(text){
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0, ch; i < text.length; i++) {
      ch = text.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
  }

  function createShareToken(dataObj){
    const jsonStr = JSON.stringify(dataObj);
    const sig = computeHash(jsonStr + SECRET_SALT);
    const payload = btoa(encodeURIComponent(jsonStr));
    return `${payload}.${sig}`;
  }

  function verifyAndParseToken(token){
    try{
      const parts = token.split('.');
      if (parts.length !== 2) return null;
      const jsonStr = decodeURIComponent(atob(parts[0]));
      const sig = parts[1];
      const expectedSig = computeHash(jsonStr + SECRET_SALT);
      if (sig !== expectedSig) return null;
      return JSON.parse(jsonStr);
    }catch(e){
      return null;
    }
  }

  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function randomSeed(){
    return Math.floor(Math.random() * 2147483647);
  }

  function buildDeck(){
    const deck = [];
    for(const suit of SUITS){ for(const rank of RANKS){ deck.push({ suit: suit.key, rank }); } }
    return deck;
  }
  function shuffle(deck, rng){
    const arr = deck.slice();
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(rng() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function dealHands4p(rng){
    const deck = shuffle(buildDeck(), rng);
    const hands = {};
    SEATS_4P.forEach((seat, idx) => { hands[seat.key] = deck.slice(idx*13, idx*13+13); });
    return hands;
  }

  function dealHands3p(rng){
    const deck = shuffle(buildDeck(), rng);
    const hands = {};
    hands.N = deck.slice(0, 13);
    hands.E = deck.slice(13, 26);
    hands.S = deck.slice(26, 39);
    hands.W = deck.slice(39, 52);
    return hands;
  }

  function getDummy3pDetails(dummyCards){
    const eView = dummyCards.slice(0, 4);
    const sView = dummyCards.slice(4, 8);
    const wView = dummyCards.slice(8, 12);
    const faceUp = dummyCards[12];

    const hcpE = calcHCP(eView);
    const hcpS = calcHCP(sView);
    const hcpW = calcHCP(wView);

    const candidates = [
      { key: 'E', label: '東', hcp: hcpE, cards: eView },
      { key: 'S', label: '南', hcp: hcpS, cards: sView },
      { key: 'W', label: '西', hcp: hcpW, cards: wView }
    ];

    let opener = candidates[0];
    for(let i = 1; i < candidates.length; i++){
      if(candidates[i].hcp > opener.hcp){
        opener = candidates[i];
      }
    }

    return { eView, sView, wView, faceUp, opener, candidates };
  }

  function groupBySuit(cards){
    const grouped = { C: [], D: [], H: [], S: [] };
    for(const c of cards){ grouped[c.suit].push(c.rank); }
    for(const s of Object.keys(grouped)){ grouped[s].sort((a,b)=> RANKS.indexOf(a)-RANKS.indexOf(b)); }
    return grouped;
  }
  function calcHCP(cards){ return cards.reduce((sum,c)=> sum + (HCP_VALUE[c.rank]||0), 0); }
  function suitMeta(key){ return SUITS.find(s=>s.key===key); }
  function shapeString(grouped){ return DISPLAY_ORDER.map(k=>grouped[k].length).join('-'); }
  function isBalanced(grouped){
    const lens = DISPLAY_ORDER.map(k=>grouped[k].length).sort((a,b)=>b-a);
    return ['4333','4432','5332'].includes(lens.join(''));
  }
  function lengthPoints(grouped){
    return DISPLAY_ORDER.reduce((sum,k)=> sum + Math.max(0, grouped[k].length-4), 0);
  }
  function longestSuit(grouped){
    let best=null, bestLen=-1;
    for(const k of DISPLAY_ORDER){ if(grouped[k].length>bestLen){ bestLen=grouped[k].length; best=k; } }
    return { key:best, len:bestLen };
  }

  function readURLParams(){
    const p = new URLSearchParams(location.search);
    if (p.has('token')) {
      const data = verifyAndParseToken(p.get('token'));
      if (data) {
        state.variant = data.v || '4p';
        state.dealMode = data.m || 'random';
        state.boardNo = data.b || 1;
        state.seed = data.s;
        state.seat = data.st;
        state.shareMode = 'shared';
        return true;
      } else {
        state.invalidToken = true;
        return false;
      }
    }
    return false;
  }

  function buildShareURL(seed, seat){
    const url = new URL(location.href);
    url.search = '';
    const token = createShareToken({
      v: state.variant,
      m: state.dealMode,
      b: state.boardNo,
      s: seed,
      st: seat
    });
    url.searchParams.set('token', token);
    return url.toString();
  }

  function setTheme(t){
    state.theme = t;
    document.body.setAttribute('data-theme', t);
    els.themeSwatches.querySelectorAll('.swatch').forEach(s=>{
      s.classList.toggle('active', s.dataset.t === t);
    });
    const p = loadPrefs(); p.theme = t; savePrefs(p);
  }
  els.themeSwatches.addEventListener('click', (e)=>{
    const btn = e.target.closest('.swatch'); if(!btn) return;
    setTheme(btn.dataset.t);
  });

  function toggleDealModeVisibility(){
    const isDup = state.dealMode === 'duplicate';
    els.boardInputWrap.hidden = !isDup;
    if (isDup) els.boardNoInput.value = state.boardNo;
    const is3p = state.variant === '3p';
    els.dealModeGroup.style.opacity = is3p ? 0.45 : 1;
    els.dealModeRadios.querySelectorAll('input').forEach(i=> i.disabled = is3p);
  }

  els.variantRadios.addEventListener('change', (e)=>{
    state.variant = e.target.value;
    const p = loadPrefs(); p.variant = state.variant; savePrefs(p);
    toggleDealModeVisibility();
  });
  els.dealModeRadios.addEventListener('change', (e)=>{
    state.dealMode = e.target.value;
    const p = loadPrefs(); p.dealMode = state.dealMode; savePrefs(p);
    toggleDealModeVisibility();
  });
  els.boardNoInput.addEventListener('change', (e)=>{
    state.boardNo = Math.max(1, Math.min(16, parseInt(e.target.value,10) || 1));
    e.target.value = state.boardNo;
  });
  els.shareModeRadios.addEventListener('change', (e)=>{ state.shareMode = e.target.value; });
  els.infoChecks.addEventListener('change', ()=>{
    els.infoChecks.querySelectorAll('input').forEach(cb=>{ state.info[cb.value] = cb.checked; });
    const p = loadPrefs(); p.info = state.info; savePrefs(p);
    if (state.lastHands) renderTable(state.lastHands, state.lastDealer, state.lastVul, state.lastBoard);
  });

  function seatMeta(key){
    const map = { N:{label:'北',full:'North'}, E:{label:'東',full:'East'}, S:{label:'南',full:'South'}, W:{label:'西',full:'West'} };
    return { key, ...map[key] };
  }

  function renderDummy3pCards(dummyCards, viewingSeat){
    const details = getDummy3pDetails(dummyCards);
    const isSolo = state.shareMode === 'solo' || !viewingSeat;

    let visibleCards = [];
    if (isSolo) {
      visibleCards = dummyCards;
    } else {
      visibleCards.push(details.faceUp);
      if (viewingSeat === 'E') visibleCards = visibleCards.concat(details.eView);
      if (viewingSeat === 'S') visibleCards = visibleCards.concat(details.sView);
      if (viewingSeat === 'W') visibleCards = visibleCards.concat(details.wView);
    }

    const groupedVisible = groupBySuit(visibleCards);
    const totalGrouped = groupBySuit(dummyCards);
    const totalHcp = calcHCP(dummyCards);

    return { details, groupedVisible, totalGrouped, totalHcp };
  }

  function renderSeat(seat, cards, opts){
    const is3pDummy = opts.isDummy;
    let grouped = groupBySuit(cards);
    let hcp = calcHCP(cards);
    let dummy3pInfo = null;

    if (is3pDummy) {
      dummy3pInfo = renderDummy3pCards(cards, state.seat);
      hcp = dummy3pInfo.totalHcp;
    }

    const wrap = document.createElement('div');
    wrap.className = `seat seat-${seat.full.toLowerCase()}`;
    if (opts.isDummy) wrap.classList.add('dummy');
    if (opts.locked) wrap.classList.add('locked');

    const inner = document.createElement('div');
    inner.className = 'seat-inner';

    const infoLine = [];
    const targetGrouped = is3pDummy ? dummy3pInfo.totalGrouped : grouped;

    if (state.info.shape) infoLine.push(`牌型 ${shapeString(targetGrouped)}`);
    if (state.info.balanced) infoLine.push(isBalanced(targetGrouped) ? '<span class="badge">均型</span>' : '<span class="badge">不均型</span>');
    if (state.info.totalPoints) infoLine.push(`總點數 ${hcp + lengthPoints(targetGrouped)}`);
    if (state.info.longest){ const ls = longestSuit(targetGrouped); infoLine.push(`最長 ${suitMeta(ls.key).glyph}×${ls.len}`); }

    const back = document.createElement('button');
    back.className = 'seat-back';
    back.type = 'button';
    back.setAttribute('aria-expanded', 'false');
    back.disabled = !!opts.locked;
    back.innerHTML = `
      <span class="seat-label">${seat.label} ${seat.key}${opts.isDummy ? '（夢家）' : ''}</span>
      <span class="seat-hint">${opts.locked ? '🔒 非你的座位' : (opts.isDummy ? '公開牌組' : '點按翻牌')}</span>
    `;

    const face = document.createElement('div');
    face.className = 'seat-face';

    const displayGrouped = is3pDummy ? dummy3pInfo.groupedVisible : grouped;

    let dummySubHtml = '';
    if (is3pDummy && dummy3pInfo) {
      const faceUpCard = dummy3pInfo.details.faceUp;
      dummySubHtml = `<div class="dummy-subgroup">攤開牌：${suitMeta(faceUpCard.suit).glyph}${faceUpCard.rank}`;
      if (state.seat && state.seat !== 'N') {
        const myDummyCards = dummy3pInfo.details[`${state.seat.toLowerCase()}View`].map(c => `${suitMeta(c.suit).glyph}${c.rank}`).join(' ');
        dummySubHtml += ` ｜ 你查看的4張：${myDummyCards}`;
      }
      dummySubHtml += `</div>`;
    }

    face.innerHTML = `
      <div class="seat-head">
        <span class="name">${seat.label}（${seat.key}）${opts.isDummy ? ' · 夢家' : ''}</span>
        ${state.info.hcp ? `<span class="hcp">HCP ${hcp}</span>` : ''}
      </div>
      ${infoLine.length ? `<div class="info-line">${infoLine.join(' ')}</div>` : ''}
      ${DISPLAY_ORDER.map(key=>{
        const meta = suitMeta(key);
        const list = displayGrouped[key];
        const cardsHtml = list.length ? list.join(' ') : '—';
        return `<div class="suit-row ${meta.color}"><span class="glyph">${meta.glyph}</span><span class="cards ${list.length?'':'empty'}">${cardsHtml}</span></div>`;
      }).join('')}
      ${dummySubHtml}
    `;

    if (!opts.isDummy && !opts.locked){
      back.addEventListener('click', ()=>{
        const revealed = wrap.classList.toggle('revealed');
        back.setAttribute('aria-expanded', String(revealed));
      });
    }

    inner.appendChild(back);
    inner.appendChild(face);
    wrap.appendChild(inner);
    return wrap;
  }

  function renderCenter(dealerSeat, vul, boardNo, extraLabel){
    const el = document.createElement('div');
    el.className = 'center-info';
    el.innerHTML = `
      <span class="dealer-tag">${extraLabel || '莊家 Dealer'}</span>
      <span class="dealer-name">${dealerSeat ? `${dealerSeat.label}（${dealerSeat.key}）` : '—'}</span>
      ${vul ? `<span class="vul-tag">身價：${VUL_LABEL[vul]}</span>` : ''}
      ${boardNo ? `<span class="board-no">牌號 #${boardNo}</span>` : ''}
    `;
    return el;
  }

  function renderTable(hands, dealerSeat, vul, boardNo){
    els.table.innerHTML = '';
    const is3p = state.variant === '3p';

    const seatOrder = [seatMeta('N'), seatMeta('E'), seatMeta('S'), seatMeta('W')];
    const nodes = {};
    seatOrder.forEach(seat=>{
      const isDummy = is3p && seat.key === 'N';
      const locked = state.shareMode === 'shared' && state.seat && state.seat !== seat.key && !isDummy;
      nodes[seat.key] = renderSeat(seat, hands[seat.key], { isDummy, locked });
      nodes[seat.key].classList.add(`seat-${seat.full.toLowerCase()}`);
    });

    let centerLabel = '莊家 Dealer';
    let centerSeat = dealerSeat;
    if (is3p){
      centerLabel = '開叫者（查看夢家 HCP 最高）';
      const dummyDetails = getDummy3pDetails(hands.N);
      centerSeat = seatMeta(dummyDetails.opener.key);
      vul = null;
    }

    els.table.appendChild(nodes.N);
    els.table.appendChild(nodes.W);
    els.table.appendChild(renderCenter(centerSeat, vul, boardNo, centerLabel));
    els.table.appendChild(nodes.E);
    els.table.appendChild(nodes.S);

    els.revealAllBtn.hidden = false;
    els.copyBtn.hidden = false;
    els.exportBtn.hidden = false;

    state.lastHands = hands; state.lastDealer = dealerSeat; state.lastVul = vul; state.lastBoard = boardNo;

    els.lockedBanner.innerHTML = '';
    if (state.shareMode === 'shared' && state.seat){
      const b = document.createElement('div');
      b.className = 'locked-banner';
      b.textContent = `你正在檢視分享牌局（牌號 #${boardNo || '-'}），你的座位：${seatMeta(state.seat).label}（${state.seat}）。其他家的牌已鎖定。`;
      els.lockedBanner.appendChild(b);
    }
  }

  function deal(){
    const is3p = state.variant === '3p';
    let dealer = null, vul = null, boardNo = null, seed = state.seed;

    if (state.dealMode === 'duplicate' && !is3p){
      boardNo = state.boardNo;
      const row = DUPLICATE_TABLE[(boardNo - 1) % 16];
      dealer = seatMeta(row.dealer);
      vul = row.vul;
    } else if (!is3p) {
      boardNo = null;
      const rngForDealer = seed !== null ? mulberry32(seed + 999) : Math.random;
      const pick = SEATS_4P[Math.floor((seed !== null ? rngForDealer() : Math.random()) * 4)];
      dealer = seatMeta(pick.key);
    }

    if (seed === null){ seed = randomSeed(); state.seed = seed; }
    const rng = mulberry32(seed);
    const hands = is3p ? dealHands3p(rng) : dealHands4p(rng);

    renderTable(hands, dealer, vul, boardNo);
    els.statusMsg.textContent = '';
    els.shareLinks.innerHTML = '';

    if (state.shareMode === 'shared' && !state.seat){
      const seats = is3p ? ['E','S','W'] : ['N','E','S','W'];
      seats.forEach(k=>{
        const row = document.createElement('div');
        row.className = 'row';
        const url = buildShareURL(seed, k);
        row.innerHTML = `<span class="seat">${seatMeta(k).label}（${k}）</span><span style="flex:1"></span><button type="button">複製加密連結</button>`;
        row.querySelector('button').addEventListener('click', ()=> copyText(url, `已複製 ${seatMeta(k).label} 家的加密連結`));
        els.shareLinks.appendChild(row);
      });
    }
  }

  els.dealBtn.addEventListener('click', ()=>{
    if (state.shareMode === 'shared' && state.seat){
      els.statusMsg.textContent = '此連結已鎖定座位與牌局，若要開新的一局請由組局者重新產生分享連結。';
      return;
    }
    state.seed = null;
    deal();
  });

  els.revealAllBtn.addEventListener('click', ()=>{
    const seats = els.table.querySelectorAll('.seat:not(.dummy):not(.locked)');
    const anyHidden = Array.from(seats).some(s=>!s.classList.contains('revealed'));
    seats.forEach(s=>{
      s.classList.toggle('revealed', anyHidden);
      s.querySelector('.seat-back').setAttribute('aria-expanded', String(anyHidden));
    });
  });

  function copyText(text, okMsg){
    const done = ()=>{ els.statusMsg.textContent = okMsg || '已複製'; setTimeout(()=>{ els.statusMsg.textContent=''; }, 2500); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(()=> fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, done){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ els.statusMsg.textContent = '複製失敗，請手動選取文字'; }
    document.body.removeChild(ta);
  }

  function formatDealAsText(){
    if (!state.lastHands) return '';
    const is3p = state.variant === '3p';
    const lines = [];
    lines.push(`牌號 #${state.lastBoard || '-'}`);
    if (!is3p && state.lastDealer) lines.push(`莊家: ${seatMeta(state.lastDealer.key).label}（${state.lastDealer.key}）`);
    if (state.lastVul) lines.push(`身價: ${VUL_LABEL[state.lastVul]}`);
    lines.push('');
    const seatKeys = state.shareMode === 'shared' && state.seat ? [state.seat] : ['N','E','S','W'];
    seatKeys.forEach(k=>{
      const meta = seatMeta(k);
      const grouped = groupBySuit(state.lastHands[k]);
      const hcp = calcHCP(state.lastHands[k]);
      lines.push(`${meta.label}（${k}）${is3p && k==='N' ? '· 夢家' : ''}  HCP=${hcp}`);
      DISPLAY_ORDER.forEach(sk=>{
        const meta2 = suitMeta(sk);
        lines.push(`${meta2.glyph} ${groupBySuitLine(grouped[sk])}`);
      });
      lines.push('');
    });
    return lines.join('\n').trim();
  }
  function groupBySuitLine(list){ return list.length ? list.join(' ') : '—'; }

  els.copyBtn.addEventListener('click', ()=>{
    const text = formatDealAsText();
    if (!text) return;
    copyText(text, '已複製本局牌型文字');
  });

  els.exportBtn.addEventListener('click', ()=>{
    if (typeof html2canvas === 'undefined'){
      els.statusMsg.textContent = '圖片匯出套件載入失敗，請確認網路連線後重試。';
      return;
    }
    els.statusMsg.textContent = '匯出圖片中…';
    html2canvas(els.table, { backgroundColor: null, scale: 2 }).then(canvas=>{
      const link = document.createElement('a');
      link.download = `bridge-board-${state.lastBoard || Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      els.statusMsg.textContent = '已匯出圖片';
      setTimeout(()=>{ els.statusMsg.textContent=''; }, 2500);
    }).catch(()=>{
      els.statusMsg.textContent = '匯出圖片時發生錯誤。';
    });
  });

  const hasValidToken = readURLParams();
  els.variantRadios.querySelector(`input[value="${state.variant}"]`).checked = true;
  els.dealModeRadios.querySelector(`input[value="${state.dealMode}"]`).checked = true;
  els.shareModeRadios.querySelector(`input[value="${state.shareMode}"]`).checked = true;
  toggleDealModeVisibility();

  if (state.invalidToken) {
    els.statusMsg.textContent = '分享連結無效或遭竄改！';
  } else if (hasValidToken){
    els.settingsPanel.removeAttribute('open');
    deal();
  }
})();
</script>

</body>
